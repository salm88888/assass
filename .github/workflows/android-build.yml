name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Linux packages (unzip, wget)
        run: sudo apt-get update && sudo apt-get install -y unzip wget curl zip

      - name: Install Android Command-line Tools and SDK packages
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Gradle
        run: |
          GRADLE_VERSION=7.5.1
          wget https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=/opt/gradle/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            # Create a wrapper with a Gradle version compatible with AGP 7.4.2
            gradle wrapper --gradle-version 7.5.1 --distribution-type bin
          fi

      - name: Build debug APK (diagnostics)
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
          GRADLE_HOME: ${{ env.GRADLE_HOME }}
        run: |
          echo "PWD: $(pwd)"
          echo "Listing repo root:"; ls -la
          echo "Listing android-app/ and android-app/app/"; ls -la android-app || true; ls -la android-app/app || true
          echo "Find any gradle-wrapper.properties:"; find . -maxdepth 4 -name gradle-wrapper.properties -print || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Which gradle:"; which gradle || true
          echo "GRADLE_HOME=$GRADLE_HOME"
          echo "GRADLE binary version:"; if [ -n "$GRADLE_HOME" ]; then $GRADLE_HOME/bin/gradle --version; fi
          echo "Running gradle assemble with explicit org.gradle.java.home pointing to JAVA_HOME"
          if [ -n "$GRADLE_HOME" ]; then $GRADLE_HOME/bin/gradle assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace; else gradle assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace; fi
        working-directory: ./

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

